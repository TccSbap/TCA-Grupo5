<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>ODS 6 - Offline</title>
    <style>
        :root {
            color-scheme: light;
            --primary-blue: #2563eb;
            --primary-blue-dark: #1d4ed8;
            --gray-50: #f9fafb;
            --gray-200: #e5e7eb;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top, rgba(37, 99, 235, 0.16), transparent 35%),
                linear-gradient(180deg, var(--gray-50), var(--white));
            color: var(--gray-800);
            padding: 24px;
        }

        .card {
            width: min(560px, 100%);
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(15, 23, 42, 0.12);
            padding: 32px;
            text-align: center;
        }

        .logo {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            margin: 0 auto 20px;
            display: block;
            object-fit: contain;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.9rem, 3vw, 2.4rem);
        }

        p {
            margin: 0 auto 24px;
            max-width: 40ch;
            color: var(--gray-600);
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a,
        button {
            appearance: none;
            border: 0;
            border-radius: 999px;
            padding: 14px 20px;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
            color: var(--white);
            box-shadow: 0 14px 24px rgba(37, 99, 235, 0.24);
        }

        .secondary {
            background: var(--gray-50);
            color: var(--gray-800);
            border: 1px solid var(--gray-200);
        }

        a:hover,
        button:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="/images/logo.png" alt="ODS 6">
        <h1>Você está offline</h1>
        <p>
            A conexão foi interrompida. Quando a internet voltar, você poderá
            continuar navegando e enviar denúncias normalmente.
        </p>
        <div class="actions">
            <a class="primary" href="/">Tentar novamente</a>
            <button class="secondary" type="button" onclick="window.location.reload()">Recarregar</button>
        </div>
    </main>
</body>
</html>
